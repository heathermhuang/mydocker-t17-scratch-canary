name: MyDocker scratch OIDC diagnostic

on:
  workflow_dispatch:

permissions:
  contents: none
  id-token: write

jobs:
  claims:
    name: Emit safe claim comparison map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_REPOSITORY: heathermhuang/mydocker-t17-scratch-canary
      EXPECTED_OWNER: heathermhuang
      EXPECTED_WORKFLOW: heathermhuang/mydocker-t17-scratch-canary/.github/workflows/mydocker-scratch-oidc-diagnostic.yml@refs/heads/main
    steps:
      - name: Compare OIDC claims without printing values
        shell: bash
        run: |
          set -eu
          node <<'NODE'
          const requestUrl = new URL(
            process.env.ACTIONS_ID_TOKEN_REQUEST_URL ?? "invalid:",
          );
          requestUrl.searchParams.set("audience", "mydocker-t17-scratch");
          const response = await fetch(requestUrl, {
            headers: {
              authorization:
                `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN ?? ""}`,
            },
          });
          if (!response.ok) {
            throw new Error("oidc_request_failed");
          }
          const body = await response.json();
          const parts =
            typeof body.value === "string" ? body.value.split(".") : [];
          if (parts.length !== 3) {
            throw new Error("oidc_token_shape_failed");
          }
          const claims = JSON.parse(
            Buffer.from(parts[1], "base64url").toString("utf8"),
          );
          const expectedSubject =
            `repo:${process.env.EXPECTED_REPOSITORY}:ref:refs/heads/main`;
          const checks = {
            aud: claims.aud === "mydocker-t17-scratch",
            event_name: claims.event_name === "workflow_dispatch",
            job_workflow_ref_present:
              typeof claims.job_workflow_ref === "string",
            job_workflow_ref_expected:
              claims.job_workflow_ref === process.env.EXPECTED_WORKFLOW,
            ref: claims.ref === "refs/heads/main",
            ref_type: claims.ref_type === "branch",
            repository:
              claims.repository === process.env.EXPECTED_REPOSITORY,
            repository_owner:
              claims.repository_owner === process.env.EXPECTED_OWNER,
            repository_visibility:
              claims.repository_visibility === "public",
            runner_environment:
              claims.runner_environment === "github-hosted",
            sha: claims.sha === process.env.GITHUB_SHA,
            sub: claims.sub === expectedSubject,
            workflow_ref_present:
              typeof claims.workflow_ref === "string",
            workflow_ref_expected:
              claims.workflow_ref === process.env.EXPECTED_WORKFLOW,
          };
          process.stdout.write(
            `${JSON.stringify({
              claimKeys: Object.keys(claims).sort(),
              checks,
            })}\n`,
          );
          if (Object.values(checks).some((value) => value !== true)) {
            process.exitCode = 1;
          }
          NODE
